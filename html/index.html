<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дипломный проект: тестовое приложение</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --text: #1c2430; --muted: #5d6b7c; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #11151b; --card: #1a212b; --text: #e6ebf2; --muted: #9aa7b8; --accent: #6ea0ff; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: min(560px, calc(100% - 32px)); padding: 32px; background: var(--card); border-radius: 12px;
           box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 16px; color: var(--muted); }
    .version { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--accent); color: #fff;
               font: 600 .9rem ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Тестовое приложение</h1>
    <p>Дипломный проект DevOps: nginx в контейнере, развёрнутый в Kubernetes (Yandex Cloud).</p>
    <p>Студент группы "SHDEVOPS-29": Коробейников Владислав Александрович</p>
    <span class="version">версия: __APP_VERSION__</span>
  </main>
</body>
</html>
